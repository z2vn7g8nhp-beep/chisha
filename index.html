<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>今天吃啥</title>
<meta name="theme-color" content="#f7f5f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天吃啥">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f7f5f0;--card:#fff;--ink:#2b2a28;--sub:#8b867e;--line:#ece7df;--soft:#f2eee7;
  --green:#34b27b;--green-s:#e5f6ee;--coral:#ff7a59;--coral-s:#fff0ea;--blue:#4c8dff;--blue-s:#eaf2ff;
  --b:#f5a623;--l:#ff7a59;--d:#7b6cf6;--s:#21b0a0;
  --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 20px 6px}
.top h1{margin:0;font-size:26px;letter-spacing:.5px;font-weight:800}
.top p{margin:2px 0 0;color:var(--sub);font-size:13px}
main{padding:0 14px calc(110px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(40,30,10,.03),0 8px 24px rgba(60,45,20,.05);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.h2{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin:0 0 10px}
.grow{flex:1}
.sub{color:var(--sub);font-size:13px}
small{font-size:12px;color:var(--sub)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:600;background:var(--ink);color:#fff;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.green{background:var(--green)}
.btn.sm{padding:7px 13px;font-size:14px}
.btn.danger{color:#d9483b}
.btn.block{width:100%}
.row{display:flex;align-items:center;gap:10px}
.center{text-align:center}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub);padding:4px 0}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button.on svg{stroke:var(--green)}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:9;width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(52,178,123,.4);transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* date nav */
.dnav{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 0}
.dnav button.arr{width:36px;height:36px;border-radius:50%;background:#fff;font-size:18px;color:var(--sub);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.dnav .dt{min-width:150px;text-align:center;font-weight:700}
.dnav .dt small{display:block;font-weight:400}
/* ring */
.hero{display:flex;align-items:center;gap:16px}
.ringbox{position:relative;width:136px;height:136px;flex:none}
.ringbox svg{width:136px;height:136px}
.ringbox .trk{fill:none;stroke:#f1ede5;stroke-width:12}
.ringbox .bar{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1),stroke .3s}
.ringbox .bar.over{stroke:var(--coral)}
.ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-t b{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.5px}
.macros{flex:1;display:flex;flex-direction:column;gap:10px}
.mac .mt{display:flex;justify-content:space-between;font-size:13px}
.mac .mt b{font-weight:600}
.pbar{height:7px;border-radius:9px;background:#f1ede5;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;border-radius:9px;background:var(--c,var(--green));width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.next{display:flex;align-items:center;gap:8px;background:var(--green-s);color:#1f7d55;border-radius:14px;padding:10px 14px;font-size:14px;margin-top:14px}
.warn-note{background:var(--coral-s);color:#b8492c;border-radius:14px;padding:10px 14px;font-size:13px;margin-top:10px}
/* meal card */
.meal .mh{display:flex;align-items:center;gap:8px}
.meal .mh .dot{width:10px;height:10px;border-radius:50%;background:var(--mc)}
.meal .mh b{font-size:16px}
.meal .mk{font-weight:700;font-size:16px}
.meal .mk small{font-weight:400}
.meal .mk.warn{color:var(--coral)}
.meal .pbar i{background:var(--mc)}
.entry{display:flex;gap:12px;align-items:center;padding:10px;margin-top:10px;border-radius:14px;background:#faf8f4;text-align:left;width:100%}
.thumbs{display:flex;flex:none}
.thumbs img,.thumbs .ph0{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#eee9e0;border:2px solid #fff}
.thumbs img+img{margin-left:-18px}
.thumbs .ph0{display:flex;align-items:center;justify-content:center;font-size:22px}
.e-txt{flex:1;min-width:0}
.e-txt div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.empty-meal{margin-top:10px;font-size:13px;color:var(--sub);background:#faf8f4;border-radius:14px;padding:12px;border:1px dashed var(--line)}
.meal-act{display:flex;gap:8px;justify-content:center;margin-top:12px}
/* water */
.cups{display:flex;gap:6px;justify-content:space-between;margin-top:4px}
.cup{flex:1;max-width:36px;height:44px;border:2px solid #cfe0ff;border-radius:6px 6px 12px 12px;position:relative;overflow:hidden;background:#fff}
.cup::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#8ab6ff,#4c8dff);transition:height .35s cubic-bezier(.3,1.4,.5,1)}
.cup.on::after{height:78%}
/* inputs */
.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.field>span{font-size:13px;color:var(--sub)}
.inp{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--green)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 8px}
.inp{min-width:0}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:14px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.07)}
textarea.inp{min-height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;background:var(--soft);font-size:13px;color:var(--ink);transition:all .15s}
.chip.on{background:var(--ink);color:#fff}
.wrow{display:flex;align-items:center;gap:10px}
.wrow .inp{width:120px;text-align:center;font-size:20px;font-weight:700}
/* plan */
.rules-top{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:4px}
.rules-top b{display:block;font-size:22px;font-weight:800}
.slots{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:8px;font-size:14px;background:#faf8f4;border-radius:12px;padding:9px 12px}
.slot i{width:8px;height:8px;border-radius:50%;background:var(--mc)}
.sug{border-left:4px solid var(--mc)}
.sug .tn{font-size:18px;font-weight:800}
.sug ul{list-style:none;margin:10px 0;padding:0}
.sug li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.sug li:last-child{border:0}
.tip{font-size:13px;color:#7a6a3a;background:#fff8e6;border-radius:10px;padding:8px 10px;margin-bottom:10px}
.tips{margin:0;padding-left:20px}
.tips li{margin:6px 0;font-size:14px}
/* log */
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats b{display:block;font-size:24px;font-weight:800}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h button{width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:12px;color:var(--sub);padding-bottom:2px}
.cal-c{position:relative;aspect-ratio:1;border-radius:12px;background:#faf8f4;overflow:hidden;display:flex;align-items:flex-start;justify-content:flex-start;padding:4px 6px;font-size:13px;font-weight:600}
.cal-c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.cal-c span{position:relative;z-index:1}
.cal-c.hasimg span{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.cal-c i{position:absolute;z-index:1;right:5px;bottom:5px;width:8px;height:8px;border-radius:50%;border:1.5px solid #fff}
.cal-c.ok i{background:var(--green)}.cal-c.over i{background:var(--coral)}.cal-c.low i{background:var(--blue)}
.cal-c.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal-c.fut{opacity:.4}
.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.wall button{aspect-ratio:1;border-radius:10px;overflow:hidden;background:#eee9e0}
.wall img{width:100%;height:100%;object-fit:cover;display:block}
.chart svg{width:100%;height:auto;display:block}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:30;display:none}
.sheet-wrap.open{display:block}
.mask{position:absolute;inset:0;background:rgba(35,28,15,.38);animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.9,.3,1.05)}
@keyframes up{from{transform:translateY(100%)}}
.sheet-h{display:flex;align-items:center;padding:14px 18px 8px}
.sheet-h b{font-size:18px;flex:1}
.sheet-h .x{width:32px;height:32px;border-radius:50%;background:var(--soft);font-size:20px;line-height:1;color:var(--sub)}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 16px;flex:1}
.sheet-f{display:flex;align-items:center;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.sec-t{font-weight:700;margin:16px 0 8px}
.ed-ph{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.ed-ph .p{position:relative;flex:none;width:84px;height:84px;border-radius:14px;overflow:hidden;background:#eee}
.ed-ph .p img{width:100%;height:100%;object-fit:cover}
.ed-ph .p button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:22px}
.ed-ph .add{flex:none;width:84px;height:84px;border-radius:14px;border:1.5px dashed #cfc8bb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--sub);background:#fff}
.ed-ph .add em{font-style:normal;font-size:24px}
.it{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:9px 10px;margin-bottom:6px}
.it .in{flex:1;min-width:0}
.it .in div{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step{display:flex;align-items:center;gap:2px}
.step button{width:30px;height:30px;border-radius:50%;background:var(--soft);font-size:17px}
.step input{width:52px;text-align:center;border:0;background:transparent;font-weight:700;outline:none;padding:0}
.step em{font-style:normal;font-size:12px;color:var(--sub);width:22px}
.rm{width:26px;height:26px;color:#c0b8aa;font-size:18px}
.res{display:flex;align-items:center;width:100%;gap:8px;padding:10px 12px;background:#fff;border-radius:12px;margin-bottom:5px;text-align:left}
.res span{flex:1;font-size:14px}
.res i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--green-s);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700}
.search{margin:6px 0 8px}
details.custom{background:#fff;border-radius:14px;padding:10px 12px;margin-top:8px}
details.custom summary{font-size:14px;font-weight:600;color:var(--green);list-style:none}
details.custom summary::-webkit-details-marker{display:none}
.tot{flex:1;font-size:13px;color:var(--sub)}
.tot b{display:block;font-size:20px;color:var(--ink)}
.dd-meal{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px}
.dd-ph{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.dd-ph img{width:110px;height:110px;border-radius:12px;object-fit:cover;flex:none}
#viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
#viewer.open{display:flex}
#viewer img{max-width:100%;max-height:100%;object-fit:contain}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 16px);transform:translate(-50%,-20px);opacity:0;z-index:60;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;pointer-events:none;transition:all .25s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.cta{text-align:center;padding:26px 18px}
.cta .big{font-size:44px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:#faf8f4;border-radius:12px;padding:10px 12px}
.kv b{display:block;font-size:20px}
.foot-note{font-size:12px;color:var(--sub);text-align:center;margin:18px 0}
</style>
</head>
<body>
<header class="top"><h1 id="ttl">今天吃啥</h1><p id="subttl"></p></header>
<main id="view"></main>

<button class="fab" data-a="cam" aria-label="拍照记一餐"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg></button>

<nav class="tabs">
  <button data-a="tab" data-v="today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>今日</button>
  <button data-a="tab" data-v="plan"><svg viewBox="0 0 24 24"><path d="M4 13h16a8 8 0 0 1-16 0z"/><path d="M9 4c-1 1.5 1 2.5 0 4M14 4c-1 1.5 1 2.5 0 4"/></svg>吃啥</button>
  <button data-a="tab" data-v="log"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>日志</button>
  <button data-a="tab" data-v="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.8 4-5.5 7.5-5.5s6.3 1.7 7.5 5.5"/></svg>我的</button>
</nav>

<div class="sheet-wrap" id="sheetWrap"><div class="mask" data-a="mask"></div><div class="sheet" id="sheet"></div></div>
<div id="viewer" data-a="closeViewer"><img alt=""></div>
<div id="toast"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="albIn" accept="image/*" multiple hidden>
<input type="file" id="impIn" accept=".json,application/json" hidden>

<script>
'use strict';
/* ================= 基础 ================= */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey=()=>ymd(new Date());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return ymd(d)};
const nowHM=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const hm2m=s=>{const [h,m]=(s||'0:0').split(':').map(Number);return h*60+m};
const m2hm=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const WD=['周日','周一','周二','周三','周四','周五','周六'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r0=n=>Math.round(n);
const r1=n=>Math.round(n*10)/10;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ================= IndexedDB ================= */
const idb={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('chisha',1);r.onupgradeneeded=()=>{const d=r.result;['kv','days','photos'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(s,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(s,mode);const st=t.objectStore(s);let out;const q=fn(st);if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(s,k){return this.tx(s,'readonly',st=>st.get(k))},
  put(s,k,v){return this.tx(s,'readwrite',st=>st.put(v,k))},
  del(s,k){return this.tx(s,'readwrite',st=>st.delete(k))},
  clear(s){return this.tx(s,'readwrite',st=>st.clear())},
  all(s){return new Promise((res,rej)=>{const out={};const t=this.db.transaction(s,'readonly');const c=t.objectStore(s).openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})}
};

/* ================= 食物库（常见估算值） ================= */
// [名称, 单位, 计量基数, 热量kcal, 蛋白g, 碳水g, 脂肪g, 默认份量, 分类]
const FOODS_RAW=[
['米饭','g',100,116,2.6,25.9,0.3,150,'主食'],['糙米饭','g',100,111,2.6,23,0.9,150,'主食'],['杂粮饭','g',100,120,3,25,0.8,150,'主食'],
['馒头','个',1,223,7,47,1.1,1,'主食'],['花卷','个',1,210,6.5,43,1.5,1,'主食'],['全麦面包','片',1,86,4.4,14,1.2,2,'主食'],

function allFoods(){return FOODS.concat(S.custom)}

function nut(it){const x=(+it.amt||0)/it.per;return {k:it.k*x,p:it.p*x,c:it.c*x,f:it.f*x}}
function sumItems(items){return items.reduce((a,it)=>{const n=nut(it);a.k+=n.k;a.p+=n.p;a.c+=n.c;a.f+=n.f;return a},{k:0,p:0,c:0,f:0})}
function blankDay(){return {meals:[],water:0,weight:null,note:'',moods:[]}}
function getDay(k){return S.days[k]||blankDay()}
function ensureDay(k){if(!S.days[k])S.days[k]=blankDay();return S.days[k]}
async function saveDay(k){await idb.put('days',k,S.days[k])}
function dayTotals(d){return sumItems(d.meals.flatMap(m=>m.items))}
function latestWeight(beforeKey){const ks=Object.keys(S.days).filter(k=>S.days[k].weight&&(!beforeKey||k<=beforeKey)).sort();return ks.length?S.days[ks[ks.length-1]].weight:null}

function calc(){
  const st=S.settings;if(!st)return null;
  const w=latestWeight()||st.weight;
  const bmr=10*w+6.25*st.height-5*st.age+(st.sex==='m'?5:-161);
  const tdee=bmr*ACT[st.act].f;
  const floor=Math.max(bmr,st.sex==='m'?1500:1200);
  let target=Math.round((tdee-PACE[st.pace].d)/10)*10,floored=false;
  if(target<floor){target=Math.ceil(floor/10)*10;floored=true}
  const refW=st.goal&&st.goal<w?(st.goal+w)/2:w;
  const p=r0(1.6*refW),f=r0(target*0.27/9),c=Math.max(0,r0((target-p*4-f*9)/4));
  const sp=st.split,tot=TYPES.reduce((a,t)=>a+(+sp[t]||0),0)||100;
  const meals={},mp={};
  TYPES.forEach(t=>{meals[t]=Math.round(target*(+sp[t]||0)/tot/10)*10;mp[t]=r0(p*(+sp[t]||0)/tot)});
  const deficit=tdee-target,weekly=deficit*7/7700;
  const weeks=st.goal&&w>st.goal&&weekly>0?Math.ceil((w-st.goal)/weekly):0;
  const bmi=w/((st.height/100)**2),goalBmi=st.goal?st.goal/((st.height/100)**2):null;
  return {w,bmr:r0(bmr),tdee:r0(tdee),target,floored,floor:r0(floor),p,c,f,meals,mp,deficit:r0(deficit),weekly,weeks,bmi,goalBmi};
}
function dayStatus(k){const d=S.days[k];if(!d||!d.meals.length)return '';const C=calc();if(!C)return '';const t=dayTotals(d).k;if(t>C.target*1.05)return 'over';if(t>=C.target*0.85)return 'ok';return k===todayKey()?'':'low'}
function activeTypes(){const sp=S.settings?.split||DEF_SET.split;return TYPES.filter(t=>t!=='s'||(+sp.s>0)||Object.values(S.days).some(d=>d.meals.some(m=>m.type==='s')))}
function autoType(){const st=S.settings||DEF_SET;const now=hm2m(nowHM());let best='l',bd=1e9;TYPES.filter(t=>t!=='s'||+st.split.s>0).forEach(t=>{const dd=Math.abs(hm2m(st.times[t])-now);if(dd<bd){bd=dd;best=t}});return best}

async function photoURL(id){if(purl[id])return purl[id];const b=await idb.get('photos',id);if(!b)return '';purl[id]=typeof b==='string'?b:URL.createObjectURL(b);return purl[id]}

function compress(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const max=1280;let w=img.naturalWidth,h=img.naturalHeight;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);cv.toBlob(b=>b?res(b):rej(new Error('压缩失败')),'image/jpeg',0.82)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('读不了这张图'))};img.src=url})}
async function delPhoto(id){try{await idb.del('photos',id)}catch(e){}if(purl[id]&&purl[id].startsWith('blob:'))URL.revokeObjectURL(purl[id]);delete purl[id]}

function mealCard(tp,d,C){

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function pickTpl(tp,k){const list=TPL.filter(t=>t.m===tp).map(t=>({t,r:hash(k+tp+t.n)})).sort((a,b)=>a.r-b.r).map(x=>x.t);const off=S.planOff[k+tp]||0;return list[off%list.length]}
function buildTpl(t,bud){
  const base=t.it.map(([n,a])=>mkItem(n,a)).filter(Boolean);const k0=sumItems(base).k;
  const f=bud&&k0?Math.min(1.35,Math.max(0.75,bud/k0)):1;
  return base.map(it=>SCALABLE.has(it.u)?{...it,amt:Math.max(10,Math.round(it.amt*f/10)*10)}:it);
}

function weightChart(){
  const pts=Object.keys(S.days).filter(k=>S.days[k].weight).sort().slice(-60).map(k=>({k,w:+S.days[k].weight}));
  if(pts.length<2)return '<p class="sub center">记录 2 次以上体重后显示趋势</p>';
  const goal=S.settings?.goal;const ws=pts.map(p=>p.w);let mn=Math.min(...ws),mx=Math.max(...ws);
  if(goal&&goal>=mn-3)mn=Math.min(mn,goal);mn-=0.5;mx+=0.5;
  const W=320,H=150,px=12,py=16;const t0=parseKey(pts[0].k).getTime(),t1=parseKey(pts[pts.length-1].k).getTime()||t0+1;
  const X=k=>px+(parseKey(k).getTime()-t0)/((t1-t0)||1)*(W-px*2);const Y=w=>py+(mx-w)/(mx-mn)*(H-py*2);
  const line=pts.map(p=>`${X(p.k).toFixed(1)},${Y(p.w).toFixed(1)}`).join(' ');
  const area=`${X(pts[0].k)},${H-py} ${line} ${X(pts[pts.length-1].k)},${H-py}`;
  const lastP=pts[pts.length-1],firstP=pts[0],ch=r1(lastP.w-firstP.w);
  return `<svg viewBox="0 0 ${W} ${H}"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34b27b" stop-opacity=".25"/><stop offset="1" stop-color="#34b27b" stop-opacity="0"/></linearGradient></defs>
    ${goal&&goal>=mn&&goal<=mx?`<line x1="${px}" x2="${W-px}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="#ff7a59" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-px}" y="${Y(goal)-4}" text-anchor="end" font-size="10" fill="#ff7a59">目标 ${goal}</text>`:''}
    <polygon points="${area}" fill="url(#wg)"/><polyline points="${line}" fill="none" stroke="#34b27b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${X(p.k)}" cy="${Y(p.w)}" r="2.6" fill="#fff" stroke="#34b27b" stroke-width="1.6"/>`).join('')}
    <text x="${X(lastP.k)}" y="${Y(lastP.w)-8}" text-anchor="end" font-size="11" font-weight="700" fill="#2b2a28">${lastP.w}</text></svg>
    <p class="sub center" style="margin:6px 0 0">${firstP.k.slice(5)} 至 ${lastP.k.slice(5)}：${ch>0?'+':''}${ch} kg</p>`;
}

    <li>用 <b>Safari</b> 打开本页（iPhone）/ 用 Chrome 或系统浏览器（安卓）</li>
    <li>点底部「分享」→「添加到主屏幕」</li>
    <li>之后从桌面图标打开，像 App 一样全屏使用；第一次打开后离线也能用</li></ol>
    <p class="sub" style="margin:8px 0 0">从桌面图标打开时数据最稳，iPhone 不会自动清理。</p></div>
    <div class="center" style="margin:16px 0"><button class="btn ghost sm danger" data-a="wipe">清空所有数据</button></div>
    <p class="foot-note">热量为常见做法的估算值。如有疾病、孕期或哺乳期，请先咨询医生。</p>`;
  view.innerHTML=h;
  if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{const u=$('#usage');if(u)u.textContent=`已用 ${(e.usage/1048576).toFixed(1)} MB · ${Object.values(S.days).reduce((a,d)=>a+d.meals.reduce((b,m)=>b+m.photos.length,0),0)} 张照片`}).catch(()=>{});
}
async function saveSettings(){
  const f=$('#setForm');const v=n=>f.querySelector(`[name="${n}"]`).value;const segv=n=>f.querySelector(`[data-seg="${n}"] .on`).dataset.v;
  const st={sex:segv('sex'),age:+v('age'),height:+v('height'),weight:+v('weight'),goal:v('goal')?+v('goal'):null,act:v('act'),pace:segv('pace'),times:{},split:{}};
  if(!(st.age>=14&&st.age<=100)||!(st.height>=120&&st.height<=230)||!(st.weight>=30&&st.weight<=250)){toast('年龄/身高/体重好像不太对');return}
  TYPES.forEach(t=>{st.times[t]=v('t_'+t)||DEF_SET.times[t];st.split[t]=Math.max(0,+v('s_'+t)||0)});
  if(!['b','l','d'].some(t=>st.split[t]>0)){toast('三餐比例不能都是 0');return}
  // 更新今天体重
  const tk=todayKey();const lw=latestWeight();
  if(st.weight!==lw){ensureDay(tk).weight=st.weight;await saveDay(tk)}
  S.settings=st;await idb.put('kv','settings',st);toast('已保存，方案已更新');render();window.scrollTo({top:0,behavior:'smooth'});
}

/* ================= 弹层 ================= */
function openSheet(title,body,foot){
  $('#sheet').innerHTML=`<div class="sheet-h"><b>${title}</b><button class="x" data-a="close">×</button></div><div class="sheet-b">${body}</div>${foot?`<div class="sheet-f">${foot}</div>`:''}`;
  $('#sheetWrap').classList.add('open');document.body.classList.add('lock');hydrate($('#sheet'));
}
function closeSheet(){$('#sheetWrap').classList.remove('open');document.body.classList.remove('lock');S.edit=null}

/* ================= 记一餐 ================= */
function openEditor({type,meal,items}={}){
  const tp=meal?meal.type:(type||autoType());
  const st=S.settings||DEF_SET;
  S.edit={date:S.date,isNew:!meal,orig:meal?meal.photos.slice():[],newPhotos:[],cat:'常用',
    meal:meal?JSON.parse(JSON.stringify(meal)):{id:uid(),type:tp,time:S.date===todayKey()?nowHM():st.times[tp],items:items||[],photos:[],note:''}};
  const E=S.edit;
  const body=`<div class="seg" id="edType">${TYPES.map(t=>`<button data-a="edType" data-v="${t}" class="${t===E.meal.type?'on':''}">${MT[t].n}</button>`).join('')}</div>
    <div class="row" style="margin-top:10px"><span class="sub">时间</span><input class="inp" id="edTime" type="time" value="${E.meal.time}" style="width:auto;padding:6px 10px"><span class="grow"></span><span class="sub" id="edBud"></span></div>
    <div class="sec-t">照片</div><div class="ed-ph" id="edPhotos"></div>
    <div class="sec-t">吃了什么 <small>（可以只拍照，之后再补）</small></div>
    <div id="edItems"></div>
    <div class="search"><input class="inp" id="edQ" type="search" placeholder="🔍 搜：鸡蛋、米饭、凉皮…" autocomplete="off"></div>
    <div class="chips" id="edCats"></div><div id="edRes" style="margin-top:8px"></div>
    <details class="custom"><summary>＋ 找不到？自定义一个食物</summary>
      <div class="grid2" style="margin-top:6px"><label class="field"><span>名称</span><input class="inp" id="cuN" placeholder="如：公司食堂套餐"></label><label class="field"><span>单位</span><input class="inp" id="cuU" value="份"></label>
      <label class="field"><span>每份热量 kcal</span><input class="inp" id="cuK" type="number" inputmode="numeric"></label><label class="field"><span>每份蛋白 g（可不填）</span><input class="inp" id="cuP" type="number" inputmode="decimal"></label></div>
      <button class="btn sm block" data-a="addCustom">添加并保存到「我的」</button></details>
    <div class="sec-t">备注</div><textarea class="inp" id="edNote" placeholder="在哪吃、口味、吃完饱不饱…">${esc(E.meal.note)}</textarea>`;
  const foot=`<div class="tot" id="edTotal"></div>${meal?'<button class="btn ghost danger" data-a="delMeal">删除</button>':''}<button class="btn green" data-a="saveMeal">保存</button>`;
  openSheet(meal?'编辑这一餐':'记一餐',body,foot);
  $('#sheet .sheet-h .x').dataset.a='cancelEdit';
  edPhotos();edItems();edCats();edRes();
}
function edPhotos(){
  const E=S.edit;$('#edPhotos').innerHTML=E.meal.photos.map((p,i)=>`<div class="p"><img data-pid="${p}" data-a="viewp" data-v="${p}" alt=""><button data-a="rmPhoto" data-i="${i}">×</button></div>`).join('')+
  `<button class="add" data-a="pickCam"><em>📷</em>拍照</button><button class="add" data-a="pickAlb"><em>🖼️</em>相册</button>`;
  hydrate($('#edPhotos'));
}
function edItems(){
  const E=S.edit;
  $('#edItems').innerHTML=E.meal.items.length?E.meal.items.map((it,i)=>{const n=nut(it);return `<div class="it"><div class="in"><div>${esc(it.n)}</div><small>${r0(n.k)} kcal · 蛋白 ${r1(n.p)}g</small></div>
    <div class="step"><button data-a="dec" data-i="${i}">−</button><input class="amt" data-i="${i}" type="number" inputmode="decimal" value="${it.amt}"><em>${it.u}</em><button data-a="inc" data-i="${i}">＋</button></div><button class="rm" data-a="rmItem" data-i="${i}">×</button></div>`}).join(''):'<p class="sub" style="margin:0 0 6px">还没添加食物，从下面搜索或点选 👇</p>';
  edTotal();
}
function edTotal(){
  const E=S.edit;if(!E)return;const t=sumItems(E.meal.items);const C=calc();
  $('#edTotal').innerHTML=`合计<b>${r0(t.k)} kcal</b>蛋白 ${r0(t.p)}g`;
  $('#edBud').textContent=C?`${MT[E.meal.type].n}预算 ${C.meals[E.meal.type]} kcal`:'';
}
function edCats(){$('#edCats').innerHTML=CATS.map(c=>`<button class="chip ${c===S.edit.cat?'on':''}" data-a="edCat" data-v="${c}">${c}</button>`).join('')}
function edRes(){
  const q=($('#edQ')?.value||'').trim();const E=S.edit;let list;
  if(q)list=allFoods().filter(f=>f.n.includes(q)||f.cat.includes(q));
  else if(E.cat==='常用'){const names=S.recent.length?S.recent:['水煮蛋','米饭','鸡胸肉(熟)','无糖豆浆','纯牛奶','清炒时蔬','苹果','玉米','杂粮饭','番茄炒蛋'];list=names.map(findFood).filter(Boolean)}
  else if(E.cat==='我的')list=S.custom;
  else list=FOODS.filter(f=>f.cat===E.cat);
  list=list.slice(0,40);
  $('#edRes').innerHTML=list.length?list.map(f=>`<button class="res" data-a="addFood" data-v="${esc(f.n)}"><span>${esc(f.n)}<br><small>${f.def}${f.u} · ${r0(f.k*f.def/f.per)} kcal</small></span><i>＋</i></button>`).join(''):`<p class="sub center">${E.cat==='我的'&&!q?'还没有自定义食物':'没找到，试试下面的自定义'}</p>`;
}
function stepOf(it){return it.u==='g'?10:it.u==='ml'?50:0.5}
async function handleFiles(files){
  const E=S.edit;if(!E||!files.length)return;
  for(const f of files){try{const b=await compress(f);const id='p'+uid();await idb.put('photos',id,b);E.meal.photos.push(id);E.newPhotos.push(id)}catch(e){toast(e.message||'照片保存失败')}}
  edPhotos();
}
async function cancelEdit(){const E=S.edit;if(E)for(const p of E.newPhotos)await delPhoto(p);closeSheet()}
async function saveMeal(){
  const E=S.edit;const m=E.meal;
  m.time=$('#edTime').value||nowHM();m.note=$('#edNote').value.trim();
  m.items.forEach(it=>{it.amt=Math.max(0,+it.amt||0)});m.items=m.items.filter(it=>it.amt>0);
  if(!m.items.length&&!m.photos.length&&!m.note){toast('拍张照或加个食物再保存');return}
  const d=ensureDay(E.date);const i=d.meals.findIndex(x=>x.id===m.id);
  if(i>=0)d.meals[i]=m;else d.meals.push(m);
  for(const p of E.orig)if(!m.photos.includes(p))await delPhoto(p);
  await saveDay(E.date);
  S.recent=[...new Set(m.items.map(x=>x.n).concat(S.recent))].slice(0,16);idb.put('kv','recent',S.recent);
  E.newPhotos=[];closeSheet();toast('已记录 ✓');render();
}
async function delMeal(){
  const E=S.edit;if(!confirm('删除这一餐和它的照片？'))return;
  const d=ensureDay(E.date);d.meals=d.meals.filter(x=>x.id!==E.meal.id);
  for(const p of new Set(E.orig.concat(E.meal.photos)))await delPhoto(p);
  await saveDay(E.date);E.newPhotos=[];closeSheet();toast('已删除');render();
}

/* ================= 备份 ================= */
const blob2url=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
function url2blob(u){const [h,d]=u.split(',');const mime=(h.match(/:(.*?);/)||[])[1]||'image/jpeg';const bin=atob(d);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
async function exportData(){
  toast('正在打包…');
  const [kv,days,raw]=await Promise.all([idb.all('kv'),idb.all('days'),idb.all('photos')]);
  const photos={};for(const [k,v] of Object.entries(raw))photos[k]=typeof v==='string'?v:await blob2url(v);
  const name=`今天吃啥备份-${todayKey()}.json`;
  const file=new File([JSON.stringify({app:'chisha',v:1,at:new Date().toISOString(),kv,days,photos})],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
async function importData(file){
  try{
    const data=JSON.parse(await file.text());
    if(data.app!=='chisha')throw new Error('不是本工具的备份文件');
    if(!confirm(`导入 ${data.at?data.at.slice(0,10):''} 的备份？当前手机上的记录会被替换。`))return;
    for(const s of ['kv','days','photos'])await idb.clear(s);
    for(const [k,v] of Object.entries(data.kv||{}))await idb.put('kv',k,v);
    for(const [k,v] of Object.entries(data.days||{}))await idb.put('days',k,v);
    for(const [k,v] of Object.entries(data.photos||{}))await idb.put('photos',k,url2blob(v));
    Object.keys(purl).forEach(k=>delete purl[k]);
    await loadAll();toast('导入完成');render();
  }catch(e){toast('导入失败：'+e.message)}
}

/* ================= 事件 ================= */
let noteTimer;
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,v=el.dataset.v,E=S.edit;
  switch(a){
    case 'tab':S.tab=v;if(v==='today'||v==='plan'){}window.scrollTo(0,0);render();break;
    case 'dprev':S.date=addDays(S.date,-1);render();break;
    case 'dnext':if(S.date<todayKey()){S.date=addDays(S.date,1);render()}break;
    case 'dtoday':S.date=todayKey();render();break;
    case 'cam':openEditor({type:el.dataset.t});$('#camIn').click();break;
    case 'add':openEditor({type:el.dataset.t});break;
    case 'edit':{const m=getDay(S.date).meals.find(x=>x.id===v);if(m)openEditor({meal:m});break}
    case 'water':{const d=ensureDay(S.date);d.water=d.water===+v?+v-1:+v;await saveDay(S.date);render();break}
    case 'saveW':{const w=parseFloat($('#wIn').value);const d=ensureDay(S.date);if(!$('#wIn').value){d.weight=null}else if(!(w>=30&&w<=250)){toast('体重好像不太对');break}else d.weight=r1(w);await saveDay(S.date);toast(d.weight?'体重已记录':'已清除');render();break}
    case 'mood':{const d=ensureDay(S.date);d.moods=d.moods.includes(v)?d.moods.filter(x=>x!==v):d.moods.concat(v);el.classList.toggle('on');await saveDay(S.date);break}
    case 'swap':{const key=S.date+el.dataset.t;S.planOff[key]=(S.planOff[key]||0)+1;idb.put('kv','planOff',S.planOff);render();break}
    case 'useTpl':{const tp=el.dataset.t;const C=calc();const items=buildTpl(pickTpl(tp,S.date),C.meals[tp]);openEditor({type:tp,items});break}
    case 'day':openDay(v);break;
    case 'editDay':closeSheet();S.date=v;S.tab='today';window.scrollTo(0,0);render();break;
    case 'mprev':case 'mnext':{const [y,m]=S.month.split('-').map(Number);const d=new Date(y,m-1+(a==='mprev'?-1:1),1);S.month=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;render();break}
    case 'viewp':e.stopPropagation();viewPhoto(v);break;
    case 'closeViewer':$('#viewer').classList.remove('open');break;
    case 'seg':{el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break}
    case 'saveSet':saveSettings();break;
    case 'export':exportData();break;
    case 'import':$('#impIn').click();break;
    case 'wipe':if(confirm('确定清空所有记录、照片和设置？建议先导出备份。')&&confirm('真的清空？无法恢复。')){for(const s of ['kv','days','photos'])await idb.clear(s);await loadAll();toast('已清空');render()}break;
    case 'close':closeSheet();break;
    case 'mask':case 'cancelEdit':if(E)await cancelEdit();else closeSheet();break;
    // 编辑器
    case 'edType':E.meal.type=v;el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));edTotal();break;
    case 'pickCam':$('#camIn').click();break;
    case 'pickAlb':$('#albIn').click();break;
    case 'rmPhoto':{const i=+el.dataset.i;const id=E.meal.photos[i];E.meal.photos.splice(i,1);if(E.newPhotos.includes(id)){E.newPhotos=E.newPhotos.filter(x=>x!==id);await delPhoto(id)}edPhotos();break}
    case 'edCat':E.cat=v;$('#edQ').value='';edCats();edRes();break;
    case 'addFood':{const it=mkItem(v);if(it){const ex=E.meal.items.find(x=>x.n===it.n);if(ex)ex.amt=r1(+ex.amt+(SCALABLE.has(ex.u)?it.def:1));else E.meal.items.push(it);edItems();toast(`+ ${it.n}`)}break}
    case 'inc':case 'dec':{const it=E.meal.items[+el.dataset.i];const s=stepOf(it);it.amt=Math.max(s,r1((+it.amt||0)+(a==='inc'?s:-s)));edItems();break}
    case 'rmItem':E.meal.items.splice(+el.dataset.i,1);edItems();break;
    case 'addCustom':{const n=$('#cuN').value.trim(),k=+$('#cuK').value,p=+$('#cuP').value||0,u=$('#cuU').value.trim()||'份';
      if(!n||!(k>=0)||$('#cuK').value===''){toast('名称和热量要填');break}
      const f={n,u,per:1,k,p,c:0,f:0,def:1,cat:'我的'};S.custom=S.custom.filter(x=>x.n!==n).concat(f);await idb.put('kv','custom',S.custom);
      E.meal.items.push(mkItem(n,1));edItems();edRes();$('#cuN').value='';$('#cuK').value='';$('#cuP').value='';el.closest('details').open=false;toast('已添加');break}
    case 'saveMeal':saveMeal();break;
    case 'delMeal':delMeal();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='edQ')edRes();
  else if(t.classList.contains('amt')&&S.edit){S.edit.meal.items[+t.dataset.i].amt=t.value;edTotal();const n=nut(S.edit.meal.items[+t.dataset.i]);t.closest('.it').querySelector('small').textContent=`${r0(n.k)} kcal · 蛋白 ${r1(n.p)}g`}
  else if(t.id==='noteIn'){clearTimeout(noteTimer);const k=S.date,val=t.value;noteTimer=setTimeout(()=>{ensureDay(k).note=val;saveDay(k)},500)}
});
document.addEventListener('change',e=>{if(e.target.classList.contains('amt')&&S.edit)edItems()});
$('#camIn').addEventListener('change',e=>{handleFiles([...e.target.files]);e.target.value=''});
$('#albIn').addEventListener('change',e=>{handleFiles([...e.target.files]);e.target.value=''});
$('#impIn').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!S.edit&&S.tab==='today'){const t=todayKey();if(S._lastToday&&S._lastToday!==t&&S.date===S._lastToday){S.date=t;render()}S._lastToday=t}});

/* ================= 启动 ================= */
async function loadAll(){
  const [kv,days]=await Promise.all([idb.all('kv'),idb.all('days')]);
  S.settings=kv.settings||null;S.custom=kv.custom||[];S.recent=kv.recent||[];S.planOff=kv.planOff||{};S.days=days||{};
  // 清理过期的“换一个”记录
  const cut=addDays(todayKey(),-3);let changed=false;for(const k of Object.keys(S.planOff))if(k.slice(0,10)<cut){delete S.planOff[k];changed=true}
  if(changed)idb.put('kv','planOff',S.planOff);
}
(async()=>{
  try{await idb.open()}catch(e){view.innerHTML='<div class="card cta"><div class="big">⚠️</div><p>这个浏览器不支持本地存储（可能开了无痕模式）。请换用 Safari / Chrome 正常模式打开。</p></div>';return}
  await loadAll();S._lastToday=todayKey();
  if(!S.settings)S.tab='me';
  render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
